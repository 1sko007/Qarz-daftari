<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Login — Sukhrob's GROUPE</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070a0f;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#263244 0,#101722 35%,#070a0f 72%)}.glow{position:fixed;width:340px;height:340px;border-radius:50%;background:#fff;opacity:.035;filter:blur(80px);top:-100px;left:50%;transform:translateX(-50%)}
.login{position:relative;width:min(430px,100%);padding:34px 28px 28px;border:1px solid #ffffff14;background:#ffffff09;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:30px;box-shadow:0 25px 80px #0008;text-align:center}
.logo{width:82px;height:82px;margin:0 auto 20px;border:2px solid #ffffffdd;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;letter-spacing:-5px;box-shadow:0 0 40px #fff2;position:relative;overflow:hidden}.logo:after{content:"";position:absolute;inset:-45%;background:linear-gradient(110deg,transparent 40%,#ffffff80,transparent 60%);transform:translateX(-70%) rotate(8deg);animation:shine 2s ease-in-out infinite}
.brand{font-size:28px;font-weight:900;letter-spacing:-1px}.group{font-size:10px;letter-spacing:6px;opacity:.55;margin:7px 0 30px 6px}.title{font-size:20px;font-weight:800;margin-bottom:5px}.subtitle{font-size:13px;color:#9ca6b4;margin-bottom:22px}
.form{text-align:left}.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:#9ca6b4;font-weight:700;margin:0 0 6px 3px}.field input{width:100%;padding:15px 15px;border:1px solid #ffffff18;border-radius:14px;background:#0d131d;color:#fff;outline:none;font-size:16px}.field input:focus{border-color:#ffffff55;box-shadow:0 0 0 3px #ffffff0b}.password{position:relative}.password input{padding-right:48px}.eye{position:absolute;right:7px;top:7px;width:40px;height:40px;border:0;background:transparent;color:#9ca6b4;font-size:18px;cursor:pointer}.submit{width:100%;margin-top:6px;padding:15px;border:0;border-radius:14px;background:#fff;color:#111827;font-size:15px;font-weight:850;cursor:pointer;transition:transform .15s,opacity .15s}.submit:active{transform:scale(.99)}.submit:disabled{opacity:.6;cursor:wait}.error{min-height:20px;color:#ff8d8d;font-size:13px;margin:11px 0 0}.footer{margin-top:25px;color:#667181;font-size:11px}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #11182733;border-top-color:#111827;border-radius:50%;vertical-align:-3px;animation:spin .7s linear infinite;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes shine{50%{transform:translateX(70%) rotate(8deg)}}@media(max-width:430px){.login{padding:29px 20px 23px}.brand{font-size:25px}}
</style>
</head>
<body>
<div class="bg"></div><div class="glow"></div>
<main class="login">
  <div class="logo">SG</div>
  <div class="brand">Sukhrob's</div><div class="group">GROUPE</div>
  <div class="title">QARZ DAFTARI</div><div class="subtitle">Davom etish uchun tizimga kiring</div>
  <form class="form" id="form">
    <div class="field"><label>LOGIN</label><input id="username" autocomplete="username" placeholder="Login" required></div>
    <div class="field password"><label>PAROL</label><input id="password" type="password" autocomplete="current-password" placeholder="Parol" required><button class="eye" type="button" id="eye" aria-label="Parolni ko‘rsatish">◉</button></div>
    <button class="submit" id="submit" type="submit">Kirish</button>
    <div class="error" id="error"></div>
  </form>
  <div class="footer">Sukhrob's GROUPE · Qarz Daftari</div>
</main>
<script>
const $=id=>document.getElementById(id);
(async()=>{try{const r=await fetch('/api/auth');const j=await r.json();if(j.authenticated)location.replace('/')}catch(_){}})();
$('eye').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password'};
$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('submit').disabled=true;$('submit').innerHTML='<span class="spinner"></span>Kirilmoqda...';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Login xatosi');location.replace('/')}catch(err){$('error').textContent=err.message;$('submit').disabled=false;$('submit').textContent='Kirish'}};
</script>
</body></html>
